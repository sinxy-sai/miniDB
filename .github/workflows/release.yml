name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    name: Verify and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ruby-full ruby-dev ruby-bundler

      - name: Install Ruby dependencies
        run: |
          bundle config set --local path vendor/bundle
          bundle install

      - name: Run test suite
        run: make test

      - name: Generate release notes from template
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f "tag_name=$GITHUB_REF_NAME" \
            -f "target_commitish=$GITHUB_SHA" \
            > /tmp/generated-release-notes.json

          jq -r '.body' /tmp/generated-release-notes.json \
            > /tmp/generated-changelog.md

          previous_tag="$(git tag --list 'v*' --sort=-version:refname \
            | grep -Fxv "$GITHUB_REF_NAME" \
            | head -n 1 || true)"
          if [[ -z "$previous_tag" ]]; then
            previous_tag="(initial release)"
          fi

          if [[ "$previous_tag" == "(initial release)" ]]; then
            commit_range="$GITHUB_SHA"
          else
            commit_range="$previous_tag..$GITHUB_SHA"
          fi

          {
            cat /tmp/generated-changelog.md
            echo
            echo "### Commit history"
            git log --no-merges --reverse --format='- `%h` — %s' "$commit_range"
          } > /tmp/complete-changelog.md

          release_status="Stable / production"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_status="Experimental / non-production"
          fi

          export PREVIOUS_TAG="$previous_tag"
          export RELEASE_STATUS="$release_status"
          python3 <<'PY'
          import os
          from pathlib import Path

          template = Path('.github/RELEASE_TEMPLATE.md').read_text(encoding='utf-8')
          changelog = Path('/tmp/complete-changelog.md').read_text(encoding='utf-8')

          replacements = {
              '{{VERSION}}': os.environ['GITHUB_REF_NAME'],
              '{{RELEASE_STATUS}}': os.environ['RELEASE_STATUS'],
              '{{PREVIOUS_TAG}}': os.environ['PREVIOUS_TAG'],
              '{{GENERATED_CHANGELOG}}': changelog.rstrip(),
          }
          for placeholder, value in replacements.items():
              template = template.replace(placeholder, value)

          Path('/tmp/release-notes.md').write_text(template, encoding='utf-8')
          PY

      - name: Package source archive
        run: |
          archive="../miniDB-${GITHUB_REF_NAME}.tar.gz"
          tar \
            --exclude='./.git' \
            --exclude='./vendor' \
            --exclude='./db' \
            --exclude='*.db' \
            -czf "$archive" .
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-file /tmp/release-notes.md \
            --title "miniDB $GITHUB_REF_NAME" \
            "${release_args[@]}" \
            "$ARCHIVE"
