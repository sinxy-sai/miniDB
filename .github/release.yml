changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "🚀 Features"
      labels:
        - feature
        - enhancement
    - title: "🐛 Fixes"
      labels:
        - bug
        - fix
    - title: "📚 Documentation and tests"
      labels:
        - documentation
        - test
    - title: "📦 Other changes"
      labels:
        - "*"
